<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Text analysis</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <h1>Text analysis</h1>
    <div class="workspace">
      <section class="panel" aria-labelledby="input-title">
        <h2 id="input-title"><label for="text-input">Text</label></h2>
        <textarea id="text-input" maxlength="100000" spellcheck="true" placeholder="Paste your text here…">Alice visited New York. She met Bob there. They watched birds in a bright garden.</textarea>
        <div class="input-meta"><span id="file-name"></span><span id="character-count">0 / 100,000 characters</span></div>
        <div class="input-actions">
          <label class="upload-button" for="file-input">Upload .txt<input id="file-input" type="file" accept=".txt,text/plain" /></label>
          <button id="clear-button" class="text-button" type="button">Clear</button>
          <button id="analyze-button" class="primary-button" type="button">Analyze</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
      <section class="panel" aria-labelledby="results-title">
        <h2 id="results-title">Results</h2>
        <div class="stats">
          <div class="stat"><span>Total words</span><strong id="total-words">—</strong></div>
          <div class="stat"><span>Unique words</span><strong id="unique-words">—</strong></div>
        </div>
        <div class="result-block"><h3>Vocabulary</h3><div id="vocabulary" class="vocabulary empty-result">—</div></div>
        <div class="result-block"><h3>Word frequency</h3><div id="frequencies" class="frequency-list empty-result">—</div></div>
        <div class="result-block"><h3>Part-of-speech tags</h3><div id="pos-tags" class="tag-list empty-result">—</div></div>
        <div class="result-block"><h3>Named entities</h3><div id="entities" class="entity-list empty-result">—</div></div>
      </section>
    </div>
  </main>
</body>
</html>
